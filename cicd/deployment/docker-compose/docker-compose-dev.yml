# PATH variables must be set in .env files.
services:
  # Start api service first so mcp service doesn't 404 when it tries to fetch jwks.json.
  api:
    build:
      context: ${PATHS_PROJECT_DIR}
      dockerfile: backend/Dockerfile.api
    container_name: api-dev
    environment:
      # Re-use the same values that the FastAPI app expects.
      - AUTH_AUDIENCE=${AUTH_AUDIENCE}
      - AUTH_JWKS_FN=${AUTH_JWKS_FN}
      - AUTH_TOKEN_ISSUER=https://tokens.local
      - AUTH_TOKEN_TTL=${AUTH_TOKEN_TTL}
      - AUTH_USER_NAME=${AUTH_USER_NAME}
      - AUTH_USER_PASSPHRASE=${AUTH_USER_PASSPHRASE}
      - PATHS_PROJECT_DIR=/usr
      - PATHS_SECRETS_DIR=/usr/secrets
    networks:
      # All services join `mcp_network` to communicate with each other. This ensures
      # they can reach each other by service name (i.e., http://api:8000).
      - mcp_network
    ports:
      - "${DEV_FASTAPI_PORT}:${DEV_FASTAPI_PORT}"  # Expose POST /api/token and GET /api/jwks.json
  caddy:
    container_name: caddy-dev
    depends_on:
      - mcp
    env_file:
      - .env
    image: "${DEV_DOCKER_CADDY_IMAGE}"
    ports:
      - "${DEV_CADDY_HTTP_PORT}:${DEV_CADDY_HTTP_PORT}"
      - "${DEV_CADDY_HTTPS_PORT}:${DEV_CADDY_HTTPS_PORT}"
      - "${DEV_CADDY_UDP_PORT}:${DEV_CADDY_UDP_PORT}/udp"
    volumes:
      - ./Caddyfile-dev:/etc/caddy/Caddyfile
      - caddy_config:/config
      - caddy_data:/data
  db:
    container_name: pg-vector-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    image: "${DEV_DOCKER_PG_VECTOR_IMAGE}"
    ports:
      - "${DEV_POSTGRES_PORT}:${DEV_POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  litellm-proxy:
    command: ["--config", "/app/config.yaml", "--detailed_debug", "--telemetry", "False"]
    container_name: litellm-proxy-dev
    image: "${DEV_DOCKER_LITELLM_IMAGE}"
    ports:
      - "${DEV_LITELLM_PORT}:${DEV_LITELLM_PORT}"
    restart: always
    volumes:
      - ${PATHS_PROJECT_DIR}/cicd/litellm/litellm_config.yaml:/app/config.yaml
  mcp:
    build:
      context: ${PATHS_PROJECT_DIR}
      dockerfile: backend/Dockerfile.mcp
    container_name: mcp_demo-dev
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
    env_file:
      - ${PATHS_PROJECT_DIR}/.env
      - ${PATHS_PROJECT_DIR}/backend/.env
    environment:
      - AUTH_JWKS_URI=http://api:8000/auth/jwks.json  # Point JWKS URI at the service name (i.e., "api")
      - CHAT_ENV=dev
      - POSTGRES_HOST=db
      - LITELLM_ENDPOINT=http://litellm-proxy:4000
      - LOGGING_LOG_LEVEL=DEBUG
      - PATHS_PROJECT_DIR=/usr
      - PATHS_SECRETS_DIR=/usr/secrets
      - REDIS_URL=redis://redis:6379
    ports:
      - "${DEV_FASTMCP_PORT}:${DEV_FASTMCP_PORT}"
  redis:
    container_name: redis-dev
    image: "${DEV_DOCKER_REDIS_IMAGE}"
    ports:
      - "${DEV_REDIS_PORT}:${DEV_REDIS_PORT}"
    restart: always

networks:
  mcp_network: {}

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
