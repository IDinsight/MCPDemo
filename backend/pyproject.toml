# black
[tool.black]
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
setup.py
'''
include = '\.pyi?$'
line-length = 88

# Build system configs
[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
include = ["mcp_demo*"]
where = ["src"]

# interrogate
[tool.interrogate]
badge-format = "svg"
color = true
exclude = ["*/__init__.py"]
ext = []
generate-badge = "../"  # Output file location
ignore-magic = false
ignore-init-method = false
ignore-init-module = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-classes = false
ignore-nested-functions = false
ignore-overloaded-functions = false
ignore-semiprivate = false
ignore-setters = false
ignore-regex = ["__init__.py*", "^mock_.*"]  # Example regex
fail-under = 100
omit-covered-files = false
quiet = false
verbose = 0  # Possible values: 0 (minimal output), 1 (-v), 2 (-vv)
whitelist-regex = []

# isort
[tool.isort]
atomic = true
filter_files = true
import_heading_firstparty = "Package Library"
import_heading_future = "Future Library"
import_heading_localfolder = "Local Folder"
import_heading_stdlib = "Standard Library"
import_heading_thirdparty = "Third Party Library"
include_trailing_comma = true
known_first_party = "mcp_demo"
known_third_party = "alembic, git, mpi4py, ntpath, numpy, pexpect"
line_length = 88
lines_between_types = 1
multi_line_output = 3

# mypy
[tool.mypy]
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# Project
[project]
authors = [{name = "IDinsight DSEM", email = "dsem@idinsight.org" }]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
]
description = "MCP Demo"
keywords = ["model context protocol", "MCP", "genai", "llm"]
maintainers = [{name = "IDinsight DSEM", email = "dsem@idinsight.org" }]
name = "mcp_demo"
readme = "README.md"
requires-python = ">=3.11,<3.13"
version = "0.1.0"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.12.14",
    "alembic>=1.16.2",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.14",
    "fastapi-csrf-protect>=1.0.3",
    "fastmcp>=2.10.6",
    "filelock>=3.18.0",
    "greenlet>=3.2.3",
    "gunicorn==23.0.0",
    "loguru>=0.7.2",
    "prometheus-client==0.21.1",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.8.0",
    "PyJWT>=2.10.1",
    "PyYAML>=6.0.1",
    "python-jose[cryptography]>=3.5.0",
    "redis>=6.2.0",
    "secure>=1.0.1",
    "sentry-sdk[fastapi]==2.23.1",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.41",
    "typer>=0.15.1",
    "uvicorn-worker==0.3.0",
]

[project.optional-dependencies]
dev = [
    "black==24.4.2",
    "detect-secrets>=1.5.0",
    "interrogate>=1.5.0",
    "isort==5.13.2",
    "mypy==1.11.0",
    "mypy-extensions==1.0.0",
    "pre-commit==3.7.1",
    "pylint==3.3.7",
    "pylint-pytest==1.1.8",
    "pytest==8.2.0",
    "pytest-alembic==0.12.1",
    "pytest-asyncio==1.1.0",
    "pytest-bdd==8.1.0",
    "pytest-cov==6.2.1",
    "pytest-mock==3.14.1",
    "pytest-order==1.3.0",
    "pytest-randomly==3.16.0",
    "pytest-xdist==3.8.0",
    "ruff==0.5.4",
]

# Pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
bdd_features_base_dir = "tests/features/"
markers = ["costs-money"]
pythonpath = ["src"]

# Pytest coverage
[tool.coverage.report]
exclude_lines = [
    'if __name__ == "__main__"',
    "if __name__ == '__main__'",
    "def cli",
    "if TYPE_CHECKING:",
    "pragma: no cover",
]
omit = ["./src/mcp_demo/__init__.py"]

[tool.coverage.run]
branch = true
concurrency = ["greenlet", "thread"]
source = ["src"]

# Ruff
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint.mccabe]
max-complexity = 10
